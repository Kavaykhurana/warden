services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: warden
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
    ports:
      - "${WARDEN_DB_PORT:-5432}:5432"
    volumes:
      - warden-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d warden"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  warden-pgdata:
